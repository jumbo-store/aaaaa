<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Showroom</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="nav">

        <a href="index.html" class="logo">
            MERK
        </a>

        <nav>

            <a href="index.html" data-i18n="showroom">
                Showroom
            </a>

            <a href="info.html" data-i18n="info">
                Info
            </a>

            <div class="language-selector">

                <button
                    class="language-button"
                    id="languageButton"
                    type="button"
                    aria-label="Language"
                    aria-expanded="false"
                >
                    <span id="currentFlag">🇬🇧</span>
                    <span class="language-arrow">⌄</span>
                </button>

                <div class="language-menu" id="languageMenu">

                    <button data-lang="nl">🇳🇱</button>
                    <button data-lang="en">🇬🇧</button>
                    <button data-lang="zh">🇨🇳</button>
                    <button data-lang="hi">🇮🇳</button>
                    <button data-lang="es">🇪🇸</button>
                    <button data-lang="fr">🇫🇷</button>
                    <button data-lang="ar">🇸🇦</button>
                    <button data-lang="bn">🇧🇩</button>
                    <button data-lang="pt">🇵🇹</button>
                    <button data-lang="ru">🇷🇺</button>
                    <button data-lang="id">🇮🇩</button>
                    <button data-lang="de">🇩🇪</button>

                </div>

            </div>

        </nav>

    </div>
</header>


<main class="products" id="productGrid">

    <!-- Producten worden automatisch geladen -->

</main>


<script src="products.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    /*
    ========================================
    PRODUCTEN IN SHOWROOM
    ========================================
    */

    const productGrid =
        document.getElementById("productGrid");


    products.forEach(function (product) {

        const row =
            document.createElement("div");

        row.className = "product-row";


        /*
        Product links
        */

        const leftText =
            document.createElement("div");

        leftText.className = "product-text";

        leftText.innerHTML = `
            <h2>${product.name}</h2>
            <div class="price">${product.price}</div>
            <p data-description="${product.id}">
                ${product.description.nl}
            </p>
        `;


        /*
        Eerste foto
        */

        const image1 =
            document.createElement("a");

        image1.className = "product-image";

        image1.href =
            `product.html?id=${product.id}`;


        if (product.images.length > 0) {

            image1.style.backgroundImage =
                `url("${product.images[0]}")`;

            image1.classList.add("has-image");

        }


        /*
        Tweede foto
        */

        const image2 =
            document.createElement("a");

        image2.className = "product-image";

        image2.href =
            `product.html?id=${product.id}`;


        if (product.images.length > 1) {

            image2.style.backgroundImage =
                `url("${product.images[1]}")`;

            image2.classList.add("has-image");

        }


        /*
        Rechter tekst
        */

        const rightText =
            document.createElement("div");

        rightText.className = "product-text";

        rightText.innerHTML = `
            <h2>${product.name}</h2>
            <div class="price">${product.price}</div>
            <p data-description="${product.id}">
                ${product.description.nl}
            </p>
        `;


        row.appendChild(leftText);
        row.appendChild(image1);
        row.appendChild(image2);
        row.appendChild(rightText);

        productGrid.appendChild(row);

    });


    /*
    ========================================
    TAAL
    ========================================
    */

    setupLanguage();

});


/* ========================================
   TAALSYSTEEM
   ======================================== */

function setupLanguage() {

    const translations = {

        nl: {
            showroom: "Showroom",
            info: "Info"
        },

        en: {
            showroom: "Showroom",
            info: "Info"
        },

        zh: {
            showroom: "展厅",
            info: "信息"
        },

        hi: {
            showroom: "शोरूम",
            info: "जानकारी"
        },

        es: {
            showroom: "Sala de exposición",
            info: "Información"
        },

        fr: {
            showroom: "Showroom",
            info: "Informations"
        },

        ar: {
            showroom: "المعرض",
            info: "معلومات"
        },

        bn: {
            showroom: "শোরুম",
            info: "তথ্য"
        },

        pt: {
            showroom: "Showroom",
            info: "Informações"
        },

        ru: {
            showroom: "Шоурум",
            info: "Информация"
        },

        id: {
            showroom: "Ruang Pamer",
            info: "Info"
        },

        de: {
            showroom: "Showroom",
            info: "Info"
        }

    };


    const flags = {

        nl: "🇳🇱",
        en: "🇬🇧",
        zh: "🇨🇳",
        hi: "🇮🇳",
        es: "🇪🇸",
        fr: "🇫🇷",
        ar: "🇸🇦",
        bn: "🇧🇩",
        pt: "🇵🇹",
        ru: "🇷🇺",
        id: "🇮🇩",
        de: "🇩🇪"

    };


    let currentLanguage =
        localStorage.getItem("language") || "nl";


    function applyLanguage(language) {

        if (!translations[language]) {
            language = "nl";
        }


        currentLanguage = language;


        localStorage.setItem(
            "language",
            language
        );


        document.documentElement.lang =
            language;


        /*
        Navigatie vertalen
        */

        document
            .querySelectorAll("[data-i18n]")
            .forEach(function (element) {

                const key =
                    element.dataset.i18n;

                if (
                    translations[language] &&
                    translations[language][key]
                ) {

                    element.textContent =
                        translations[language][key];

                }

            });


        /*
        Productomschrijvingen
        */

        document
            .querySelectorAll("[data-description]")
            .forEach(function (element) {

                const id =
                    element.dataset.description;

                const product =
                    products.find(
                        p => p.id == id
                    );

                if (
                    product &&
                    product.description[language]
                ) {

                    element.textContent =
                        product.description[language];

                } else if (
                    product &&
                    product.description.en
                ) {

                    element.textContent =
                        product.description.en;

                }

            });


        /*
        Vlag
        */

        document.getElementById(
            "currentFlag"
        ).textContent =
            flags[language];

    }


    /*
    Dropdown openen/sluiten
    */

    const languageButton =
        document.getElementById(
            "languageButton"
        );

    const languageMenu =
        document.getElementById(
            "languageMenu"
        );


    languageButton.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            const isOpen =
                languageMenu.classList.toggle(
                    "open"
                );

            languageButton.setAttribute(
                "aria-expanded",
                isOpen
            );

        }
    );


    /*
    Taal selecteren
    */

    languageMenu
        .querySelectorAll("button")
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    applyLanguage(
                        button.dataset.lang
                    );

                    languageMenu.classList.remove(
                        "open"
                    );

                    languageButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }
            );

        });


    /*
    Klik buiten dropdown
    */

    document.addEventListener(
        "click",
        function () {

            languageMenu.classList.remove(
                "open"
            );

            languageButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }
    );


    applyLanguage(
        currentLanguage
    );

}

</script>

</body>
</html>
