<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Showroom</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="nav">

        <a href="index.html" class="logo">
            MERK
        </a>

        <nav>
            <a href="index.html">Showroom</a>
            <a href="leverinfo.html">Leverinfo</a>
            <a href="productinfo.html">Productinfo</a>
        </nav>

    </div>
</header>


<main class="product-page">

    <a href="index.html" class="back">
        ← Terug naar showroom
    </a>


    <section class="product-detail">

        <!-- FOTO GALERIJ -->

        <div class="gallery">

            <div class="gallery-window">

                <div class="gallery-track" id="galleryTrack">
                    <!-- Foto's worden automatisch toegevoegd -->
                </div>

            </div>


            <!-- Navigatiebolletjes -->

            <div class="gallery-dots" id="galleryDots"></div>

        </div>


        <!-- PRODUCT INFORMATIE -->

        <div class="product-detail-info">

            <h1 id="productName">
                Product
            </h1>

            <div class="detail-price" id="productPrice">
                €0
            </div>

            <p id="productDescription">
                Productomschrijving.
            </p>

        </div>

    </section>

</main>


<script>

const products = {

    1: {
        name: "Product 1",
        price: "€49",
        description: "Korte omschrijving van product 1.",
        images: [
            "images/product-01/1.jpg",
            "images/product-01/2.jpg",
            "images/product-01/3.jpg",
            "images/product-01/4.jpg"
        ]
    },

    2: {
        name: "Product 2",
        price: "€79",
        description: "Korte omschrijving van product 2.",
        images: [
            "images/product-02/1.jpg",
            "images/product-02/2.jpg",
            "images/product-02/3.jpg",
            "images/product-02/4.jpg"
        ]
    },

    3: {
        name: "Product 3",
        price: "€59",
        description: "Korte omschrijving van product 3.",
        images: [
            "images/product-03/1.jpg",
            "images/product-03/2.jpg",
            "images/product-03/3.jpg",
            "images/product-03/4.jpg"
        ]
    },

    4: {
        name: "Product 4",
        price: "€89",
        description: "Korte omschrijving van product 4.",
        images: [
            "images/product-04/1.jpg",
            "images/product-04/2.jpg",
            "images/product-04/3.jpg",
            "images/product-04/4.jpg"
        ]
    }

};


/* =========================
   PRODUCT SELECTEREN
   ========================= */

const params = new URLSearchParams(window.location.search);

const productId = params.get("id") || "1";

const product = products[productId] || products[1];


/* =========================
   PRODUCT INFORMATIE
   ========================= */

document.getElementById("productName").textContent =
    product.name;

document.getElementById("productPrice").textContent =
    product.price;

document.getElementById("productDescription").textContent =
    product.description;


/* =========================
   GALERIJ
   ========================= */

const galleryTrack =
    document.getElementById("galleryTrack");

const galleryDots =
    document.getElementById("galleryDots");

let currentSlide = 0;


/* =========================
   FOTO'S + BOLLETJES
   ========================= */

product.images.forEach(function (image, index) {

    const slide =
        document.createElement("div");

    slide.className = "gallery-slide";


    const img =
        document.createElement("img");

    img.src = image;

    img.alt =
        `${product.name} - foto ${index + 1}`;

    img.draggable = false;


    slide.appendChild(img);

    galleryTrack.appendChild(slide);


    /* Bolletje */

    const dot =
        document.createElement("button");

    dot.type = "button";

    dot.className = "gallery-dot";


    if (index === 0) {
        dot.classList.add("active");
    }


    dot.addEventListener("click", function () {

        currentSlide = index;

        galleryTrack.scrollTo({
            left: galleryTrack.clientWidth * index,
            behavior: "smooth"
        });

    });


    galleryDots.appendChild(dot);

});


/* =========================
   SWIPE / SCROLL
   ========================= */

/*
   We gebruiken hier bewust de
   native mobiele horizontale scroll.

   Hierdoor kan je telefoon zelf
   de swipe-beweging afhandelen.
*/

galleryTrack.addEventListener("scroll", function () {

    const slideWidth =
        galleryTrack.clientWidth;


    if (slideWidth <= 0) {
        return;
    }


    const newSlide =
        Math.round(
            galleryTrack.scrollLeft / slideWidth
        );


    if (newSlide !== currentSlide) {

        currentSlide = newSlide;


        const dots =
            galleryDots.querySelectorAll(".gallery-dot");


        dots.forEach(function (dot, index) {

            dot.classList.toggle(
                "active",
                index === currentSlide
            );

        });

    }

});


/* =========================
   STARTPOSITIE
   ========================= */

galleryTrack.scrollLeft = 0;

</script>

</body>
</html>
