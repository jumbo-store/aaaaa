/* =========================
   PRODUCT SELECTEREN
   ========================= */

const params = new URLSearchParams(window.location.search);

const productId = params.get("id") || "1";

const product = products[productId] || products[1];


/* =========================
   PRODUCT INFO
   ========================= */

document.getElementById("productName").textContent =
    product.name;

document.getElementById("productPrice").textContent =
    product.price;


/* =========================
   GALERIJ
   ========================= */

const galleryTrack =
    document.getElementById("galleryTrack");

const galleryDots =
    document.getElementById("galleryDots");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

let currentSlide = 0;


/* =========================
   BESCHRIJVING
   ========================= */

function updateProductDescription() {

    const language =
        localStorage.getItem("language") || "nl";

    const description =
        product.description[language] ||
        product.description.nl ||
        product.description.en ||
        "";

    document.getElementById(
        "productDescription"
    ).textContent = description;
}


/* =========================
   FOTO'S
   ========================= */

product.images.forEach(function(image, index) {

    const slide =
        document.createElement("div");

    slide.className =
        "gallery-slide";


    const img =
        document.createElement("img");

    img.src = image;

    img.alt =
        `${product.name} - foto ${index + 1}`;

    img.draggable = false;


    slide.appendChild(img);

    galleryTrack.appendChild(slide);


    const dot =
        document.createElement("button");

    dot.type = "button";

    dot.className =
        "gallery-dot";


    if (index === 0) {
        dot.classList.add("active");
    }


    dot.addEventListener("click", function() {

        goToSlide(index);

    });


    galleryDots.appendChild(dot);

});


/* =========================
   SLIDE FUNCTIE
   ========================= */

function goToSlide(index) {

    if (index < 0) {
        index = 0;
    }

    if (index >= product.images.length) {
        index = product.images.length - 1;
    }

    currentSlide = index;


    galleryTrack.scrollTo({

        left:
            galleryTrack.clientWidth *
            currentSlide,

        behavior: "smooth"

    });


    updateDots();

    updateArrows();

}


/* =========================
   BOLLETJES
   ========================= */

function updateDots() {

    const dots =
        galleryDots.querySelectorAll(
            ".gallery-dot"
        );


    dots.forEach(function(dot, index) {

        dot.classList.toggle(
            "active",
            index === currentSlide
        );

    });

}


/* =========================
   PIJLEN
   ========================= */

function updateArrows() {

    previousButton.disabled =
        currentSlide === 0;

    nextButton.disabled =
        currentSlide ===
        product.images.length - 1;

}


/* =========================
   PIJLTJES KLIKKEN
   ========================= */

previousButton.addEventListener(
    "click",
    function() {

        goToSlide(
            currentSlide - 1
        );

    }
);


nextButton.addEventListener(
    "click",
    function() {

        goToSlide(
            currentSlide + 1
        );

    }
);


/* =========================
   SWIPE / SCROLL
   ========================= */

galleryTrack.addEventListener(
    "scroll",
    function() {

        const width =
            galleryTrack.clientWidth;

        if (!width) {
            return;
        }


        const slide =
            Math.round(
                galleryTrack.scrollLeft /
                width
            );


        if (
            slide >= 0 &&
            slide < product.images.length &&
            slide !== currentSlide
        ) {

            currentSlide = slide;

            updateDots();

            updateArrows();

        }

    }
);


/* =========================
   TOETSENBORD
   ========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft") {
            goToSlide(currentSlide - 1);
        }

        if (event.key === "ArrowRight") {
            goToSlide(currentSlide + 1);
        }

    }
);


/* =========================
   START
   ========================= */

updateProductDescription();

updateDots();

updateArrows();
