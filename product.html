<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="nav">

        <a
            href="index.html"
            class="logo"
        >
            MERK
        </a>


        <nav>

            <a
                href="index.html"
                data-i18n="showroom"
            >
                Showroom
            </a>

            <a
                href="info.html"
                data-i18n="info"
            >
                Info
            </a>


            <div class="language-selector">

                <button
                    class="language-button"
                    id="languageButton"
                    type="button"
                    aria-label="Language"
                    aria-expanded="false"
                >

                    <span id="currentFlag">
                        🇬🇧
                    </span>

                    <span class="language-arrow">
                        ⌄
                    </span>

                </button>


                <div
                    class="language-menu"
                    id="languageMenu"
                >

                    <button data-lang="nl">🇳🇱</button>
                    <button data-lang="en">🇬🇧</button>
                    <button data-lang="zh">🇨🇳</button>
                    <button data-lang="hi">🇮🇳</button>
                    <button data-lang="es">🇪🇸</button>
                    <button data-lang="fr">🇫🇷</button>
                    <button data-lang="ar">🇸🇦</button>
                    <button data-lang="bn">🇧🇩</button>
                    <button data-lang="pt">🇵🇹</button>
                    <button data-lang="ru">🇷🇺</button>
                    <button data-lang="id">🇮🇩</button>
                    <button data-lang="de">🇩🇪</button>

                </div>

            </div>

        </nav>

    </div>

</header>



<main class="product-page">


    <a
        href="index.html"
        class="back"
        data-i18n="back"
    >
        ← Terug
    </a>



    <section class="product-detail">


        <!-- GALERIJ -->

        <div class="gallery">

            <div class="gallery-window">

                <div
                    class="gallery-track"
                    id="galleryTrack"
                >
                </div>


                <!-- VORIGE -->

                <button
                    class="gallery-arrow gallery-prev"
                    id="prevButton"
                    type="button"
                    aria-label="Previous image"
                >
                    ←
                </button>


                <!-- VOLGENDE -->

                <button
                    class="gallery-arrow gallery-next"
                    id="nextButton"
                    type="button"
                    aria-label="Next image"
                >
                    →
                </button>

            </div>


            <div
                class="gallery-dots"
                id="galleryDots"
            >
            </div>

        </div>



        <!-- PRODUCT INFORMATIE -->

        <div class="product-detail-info">

            <h1 id="productName">
                Product
            </h1>


            <div
                class="detail-price"
                id="productPrice"
            >
                €0
            </div>


            <p id="productDescription">
                Productomschrijving.
            </p>

        </div>


    </section>

</main>



<script src="products.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /*
        ====================================
        PRODUCT SELECTEREN
        ====================================
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const productId =
            parseInt(
                params.get("id"),
                10
            ) || 1;


        const product =
            products.find(
                item => item.id === productId
            ) || products[0];


        /*
        ====================================
        PRODUCT INFORMATIE
        ====================================
        */

        document.getElementById(
            "productName"
        ).textContent =
            product.name;


        document.getElementById(
            "productPrice"
        ).textContent =
            product.price;


        /*
        ====================================
        GALERIJ
        ====================================
        */

        const galleryTrack =
            document.getElementById(
                "galleryTrack"
            );


        const galleryDots =
            document.getElementById(
                "galleryDots"
            );


        const prevButton =
            document.getElementById(
                "prevButton"
            );


        const nextButton =
            document.getElementById(
                "nextButton"
            );


        let currentSlide = 0;


        /*
        ====================================
        FOTO'S AANMAKEN
        ====================================
        */

        product.images.forEach(
            function (image, index) {


                const slide =
                    document.createElement(
                        "div"
                    );


                slide.className =
                    "gallery-slide";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    image;


                img.alt =
                    `${product.name} - foto ${index + 1}`;


                img.draggable =
                    false;


                slide.appendChild(img);

                galleryTrack.appendChild(slide);


                /*
                Bolletje
                */

                const dot =
                    document.createElement(
                        "button"
                    );


                dot.type =
                    "button";


                dot.className =
                    "gallery-dot";


                if (index === 0) {

                    dot.classList.add(
                        "active"
                    );

                }


                dot.addEventListener(
                    "click",
                    function () {

                        goToSlide(index);

                    }
                );


                galleryDots.appendChild(
                    dot
                );

            }
        );


        /*
        ====================================
        NAAR FOTO
        ====================================
        */

        function goToSlide(index) {


            if (
                index < 0 ||
                index >= product.images.length
            ) {
                return;
            }


            currentSlide =
                index;


            galleryTrack.scrollTo({

                left:
                    galleryTrack.clientWidth *
                    index,

                behavior:
                    "smooth"

            });


            updateDots();

        }


        /*
        ====================================
        BOLLETJES BIJWERKEN
        ====================================
        */

        function updateDots() {

            const dots =
                galleryDots.querySelectorAll(
                    ".gallery-dot"
                );


            dots.forEach(
                function (dot, index) {

                    dot.classList.toggle(
                        "active",
                        index === currentSlide
                    );

                }
            );

        }


        /*
        ====================================
        VORIGE
        ====================================
        */

        prevButton.addEventListener(
            "click",
            function () {

                let newIndex =
                    currentSlide - 1;


                if (newIndex < 0) {

                    newIndex =
                        product.images.length - 1;

                }


                goToSlide(newIndex);

            }
        );


        /*
        ====================================
        VOLGENDE
        ====================================
        */

        nextButton.addEventListener(
            "click",
            function () {

                let newIndex =
                    currentSlide + 1;


                if (
                    newIndex >=
                    product.images.length
                ) {

                    newIndex = 0;

                }


                goToSlide(newIndex);

            }
        );


        /*
        ====================================
        SWIPE
        ====================================
        */

        galleryTrack.addEventListener(
            "scroll",
            function () {

                const slideWidth =
                    galleryTrack.clientWidth;


                if (slideWidth <= 0) {
                    return;
                }


                const detectedSlide =
                    Math.round(
                        galleryTrack.scrollLeft /
                        slideWidth
                    );


                if (
                    detectedSlide !==
                    currentSlide
                ) {

                    currentSlide =
                        detectedSlide;

                    updateDots();

                }

            }
        );


        /*
        ====================================
        TAAL
        ====================================
        */

        setupLanguage(
            product
        );

    }
);



/*
========================================
TAALSYSTEEM
========================================
*/

function setupLanguage(product) {


    const translations = {

        nl: {
            showroom: "Showroom",
            info: "Info",
            back: "← Terug"
        },

        en: {
            showroom: "Showroom",
            info: "Info",
            back: "← Back"
        },

        zh: {
            showroom: "展厅",
            info: "信息",
            back: "← 返回"
        },

        hi: {
            showroom: "शोरूम",
            info: "जानकारी",
            back: "← वापस"
        },

        es: {
            showroom: "Sala de exposición",
            info: "Información",
            back: "← Volver"
        },

        fr: {
            showroom: "Showroom",
            info: "Informations",
            back: "← Retour"
        },

        ar: {
            showroom: "المعرض",
            info: "معلومات",
            back: "← رجوع"
        },

        bn: {
            showroom: "শোরুম",
            info: "তথ্য",
            back: "← ফিরে যান"
        },

        pt: {
            showroom: "Showroom",
            info: "Informações",
            back: "← Voltar"
        },

        ru: {
            showroom: "Шоурум",
            info: "Информация",
            back: "← Назад"
        },

        id: {
            showroom: "Ruang Pamer",
            info: "Info",
            back: "← Kembali"
        },

        de: {
            showroom: "Showroom",
            info: "Info",
            back: "← Zurück"
        }

    };


    const flags = {

        nl: "🇳🇱",
        en: "🇬🇧",
        zh: "🇨🇳",
        hi: "🇮🇳",
        es: "🇪🇸",
        fr: "🇫🇷",
        ar: "🇸🇦",
        bn: "🇧🇩",
        pt: "🇵🇹",
        ru: "🇷🇺",
        id: "🇮🇩",
        de: "🇩🇪"

    };


    let language =
        localStorage.getItem(
            "language"
        ) || "nl";


    function applyLanguage(lang) {

        if (!translations[lang]) {
            lang = "nl";
        }


        language = lang;


        localStorage.setItem(
            "language",
            language
        );


        document.documentElement.lang =
            language;


        document
            .querySelectorAll("[data-i18n]")
            .forEach(function (element) {

                const key =
                    element.dataset.i18n;


                if (
                    translations[language] &&
                    translations[language][key]
                ) {

                    element.textContent =
                        translations[language][key];

                }

            });


        const description =
            product.description[language] ||
            product.description.en ||
            product.description.nl;


        document.getElementById(
            "productDescription"
        ).textContent =
            description;


        document.getElementById(
            "currentFlag"
        ).textContent =
            flags[language];

    }


    const languageButton =
        document.getElementById(
            "languageButton"
        );


    const languageMenu =
        document.getElementById(
            "languageMenu"
        );


    languageButton.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();


            const isOpen =
                languageMenu.classList.toggle(
                    "open"
                );


            languageButton.setAttribute(
                "aria-expanded",
                isOpen
            );

        }
    );


    languageMenu
        .querySelectorAll("button")
        .forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        applyLanguage(
                            button.dataset.lang
                        );


                        languageMenu.classList.remove(
                            "open"
                        );


                        languageButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }
                );

            }
        );


    document.addEventListener(
        "click",
        function () {

            languageMenu.classList.remove(
                "open"
            );


            languageButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }
    );


    applyLanguage(language);

}

</script>

</body>
</html>
