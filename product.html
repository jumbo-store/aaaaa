<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product</title>

    <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

<header class="site-header">

    <div class="nav">

        <a href="index.html" class="logo">
            <img src="images/logo-elephant.png?v=6" alt="Merk logo">
        </a>

        <nav>
            <a href="index.html" data-i18n="navShowroom">Showroom</a>
            <a href="info.html" data-i18n="navInfo">Info</a>

            <div class="language">

                <button class="language-button" id="languageButton" type="button" aria-haspopup="true" aria-expanded="false">
                    <span id="currentFlag">🇳🇱</span>
                    <span class="language-arrow">⌄</span>
                </button>

                <div class="language-menu" id="languageMenu">

                    <button type="button" data-language="nl">🇳🇱 <span>Nederlands</span></button>
                    <button type="button" data-language="en">🇬🇧 <span>English</span></button>
                    <button type="button" data-language="de">🇩🇪 <span>Deutsch</span></button>
                    <button type="button" data-language="fr">🇫🇷 <span>Français</span></button>
                    <button type="button" data-language="es">🇪🇸 <span>Español</span></button>
                    <button type="button" data-language="it">🇮🇹 <span>Italiano</span></button>
                    <button type="button" data-language="pt">🇵🇹 <span>Português</span></button>
                    <button type="button" data-language="zh">🇨🇳 <span>中文</span></button>
                    <button type="button" data-language="ja">🇯🇵 <span>日本語</span></button>
                    <button type="button" data-language="ko">🇰🇷 <span>한국어</span></button>
                    <button type="button" data-language="ar">🇸🇦 <span>العربية</span></button>
                    <button type="button" data-language="ru">🇷🇺 <span>Русский</span></button>
                </div>
            </div>

            <div class="currency-selector">
                <button class="currency-button" id="currencyButton" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Currency">
                    <span id="currentCurrency">EUR</span>
                    <span class="currency-arrow">⌄</span>
                </button>

                <div class="currency-menu" id="currencyMenu">
                    <button type="button" data-currency="EUR">EUR <span>€ Euro</span></button>
                    <button type="button" data-currency="USD">USD <span>$ US Dollar</span></button>
                    <button type="button" data-currency="GBP">GBP <span>£ Pound</span></button>
                    <button type="button" data-currency="CHF">CHF <span>Swiss Franc</span></button>
                    <button type="button" data-currency="JPY">JPY <span>¥ Yen</span></button>
                    <button type="button" data-currency="CNY">CNY <span>¥ Yuan</span></button>
                    <button type="button" data-currency="CAD">CAD <span>CA$ Canadian Dollar</span></button>
                    <button type="button" data-currency="AUD">AUD <span>A$ Australian Dollar</span></button>
                </div>
            </div>

        </nav>

    </div>

</header>


<main class="product-page">

    <a href="index.html" class="back" aria-label="Terug naar showroom">
        <span class="back-icon" aria-hidden="true">←</span>
        <span class="back-label" data-i18n="backLabel">Terug</span>
    </a>


    <section class="product-detail">

        <div class="gallery">

            <div class="gallery-window">

                <div class="gallery-track" id="galleryTrack"></div>


                <!-- Pijlen -->

                <button
                    type="button"
                    class="gallery-arrow gallery-arrow-left"
                    id="previousButton"
                    aria-label="Vorige afbeelding">
                    ‹
                </button>

                <button
                    type="button"
                    class="gallery-arrow gallery-arrow-right"
                    id="nextButton"
                    aria-label="Volgende afbeelding">
                    ›
                </button>

            </div>


            <div class="gallery-dots" id="galleryDots"></div>

        </div>


        <div class="product-detail-info">

            <span class="eyebrow" data-i18n="productEyebrow">
                SELECTED PRODUCT
            </span>

            <h1 id="productName">
                Product
            </h1>

            <div class="detail-price" id="productPrice">
                €0
            </div>

            <p id="productDescription">
                Productomschrijving.
            </p>

            <div id="productPricing" class="product-pricing"></div>

        </div>

    </section>

</main>


<script src="products.js?v=6"></script>
<script src="currency.js?v=6"></script>
<script src="language.js?v=6"></script>

<script>

const params = new URLSearchParams(window.location.search);
const productId = Number(params.get("id") || 1);
const product = products.find(function(item) {
    return item.id === productId;
}) || products[0];

const productName = document.getElementById("productName");
const productDescription = document.getElementById("productDescription");
const productPricing = document.getElementById("productPricing");
const galleryTrack = document.getElementById("galleryTrack");
const galleryDots = document.getElementById("galleryDots");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");

let currentSlide = 0;

productName.textContent = product.name;

function updateProductDescription() {
    const language = localStorage.getItem("language") || "nl";
    const description =
        product.description[language] ||
        product.description.nl ||
        product.description.en ||
        "";
    productDescription.textContent = description;
}

function formatProductPrice(amount) {
    if (typeof window.formatCurrency === "function") {
        return window.formatCurrency(amount);
    }
    return "€" + Number(amount).toFixed(2);
}

function getCheapestTier() {
    const tiers = Array.isArray(product.prices) ? product.prices : [];
    if (!tiers.length) return null;

    return tiers.reduce(function(lowest, tier) {
        return Number(tier.priceEUR) < Number(lowest.priceEUR) ? tier : lowest;
    }, tiers[0]);
}

function getLanguageData() {
    const language = localStorage.getItem("language") || "nl";
    if (typeof translations !== "undefined") {
        return translations[language] || translations.en || {};
    }
    return {};
}

function updateProductMainPrice() {
    const element = document.getElementById("productPrice");
    const cheapestTier = getCheapestTier();
    if (element && cheapestTier) {
        const languageData = getLanguageData();
        const fromLabel = languageData.fromLabel || "From";
        element.textContent = fromLabel + ": " + formatProductPrice(cheapestTier.priceEUR);
    }
}

function updateProductPricing() {
    if (!productPricing) return;

    const languageData = getLanguageData();
    const title = languageData.priceListTitle || "Price list";
    const perUnitLabel = languageData.perUnitLabel || "per";

    productPricing.innerHTML = "";

    const heading = document.createElement("h2");
    heading.textContent = title;
    productPricing.appendChild(heading);

    const list = document.createElement("div");
    list.className = "pricing-list";

    (product.prices || []).forEach(function(tier) {
        const row = document.createElement("div");
        row.className = "pricing-row";

        const quantity = document.createElement("span");
        quantity.className = "pricing-quantity";
        quantity.textContent = tier.quantity + " " + (product.unitType || "eenheid");

        const price = document.createElement("span");
        price.className = "pricing-price";

        const totalPrice = document.createElement("strong");
        totalPrice.textContent = formatProductPrice(tier.priceEUR);

        const unitPrice = document.createElement("small");
        const unitCost = Number(tier.priceEUR) / Number(tier.quantity || 1);
        unitPrice.textContent = " = " + formatProductPrice(unitCost) + " " + perUnitLabel + " " + (product.unitType || "eenheid");

        price.appendChild(totalPrice);
        price.appendChild(unitPrice);

        row.appendChild(quantity);
        row.appendChild(price);
        list.appendChild(row);
    });

    productPricing.appendChild(list);
}

function buildGallery() {
    galleryTrack.innerHTML = "";
    galleryDots.innerHTML = "";

    const imageList = Array.isArray(product.images) && product.images.length
        ? product.images
        : [null, null, null, null];

    imageList.forEach(function(image, index) {
        const slide = document.createElement("div");
        slide.className = "gallery-slide";

        const placeholder = document.createElement("div");
        placeholder.className = "gallery-placeholder";
        placeholder.innerHTML =
            '<span class="gallery-placeholder-product">' + String(product.id).padStart(2, "0") + '</span>' +
            '<span class="gallery-placeholder-photo">' + String(index + 1).padStart(2, "0") + '</span>';
        slide.appendChild(placeholder);

        const img = document.createElement("img");
        img.alt = product.name + " - foto " + (index + 1);
        if (image) {
            img.src = image;
        } else {
            img.remove();
        }
        img.loading = index === 0 ? "eager" : "lazy";
        img.decoding = "async";
        img.draggable = false;
        img.addEventListener("load", function() {
            placeholder.hidden = true;
            slide.classList.add("has-image");
        });
        img.addEventListener("error", function() {
            img.remove();
        });

        slide.appendChild(img);
        galleryTrack.appendChild(slide);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "gallery-dot";
        dot.setAttribute("aria-label", "Foto " + (index + 1));
        if (index === 0) dot.classList.add("active");
        dot.addEventListener("click", function() { goToSlide(index); });
        galleryDots.appendChild(dot);
    });
}

function goToSlide(index) {
    if (index < 0) index = 0;
    if (index >= product.images.length) index = galleryTrack.querySelectorAll(".gallery-slide").length - 1;
    currentSlide = index;

    galleryTrack.scrollTo({
        left: galleryTrack.clientWidth * currentSlide,
        behavior: "smooth"
    });

    updateDots();
    updateArrows();
}

function updateDots() {
    galleryDots.querySelectorAll(".gallery-dot").forEach(function(dot, index) {
        dot.classList.toggle("active", index === currentSlide);
    });
}

function updateArrows() {
    previousButton.disabled = currentSlide === 0;
    nextButton.disabled = currentSlide === galleryTrack.querySelectorAll(".gallery-slide").length - 1;
}

previousButton.addEventListener("click", function() {
    goToSlide(currentSlide - 1);
});

nextButton.addEventListener("click", function() {
    goToSlide(currentSlide + 1);
});

galleryTrack.addEventListener("scroll", function() {
    const width = galleryTrack.clientWidth;
    if (!width) return;
    const slide = Math.round(galleryTrack.scrollLeft / width);
    if (slide !== currentSlide && slide >= 0 && slide < product.images.length) {
        currentSlide = slide;
        updateDots();
        updateArrows();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowLeft") goToSlide(currentSlide - 1);
    if (event.key === "ArrowRight") goToSlide(currentSlide + 1);
});

document.addEventListener("currencyChanged", function() {
    updateProductMainPrice();
    updateProductPricing();
});
document.addEventListener("languageChanged", function() {
    updateProductDescription();
    updateProductPricing();
});

buildGallery();
updateProductDescription();
updateProductMainPrice();
updateProductPricing();
updateDots();
updateArrows();

</script>

</body>
</html>
